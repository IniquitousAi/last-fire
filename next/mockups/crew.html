<!doctype html><html><head><meta charset="utf-8"><title>Crew suit</title><meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; color: #eef0f8; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; background: #05060bd0; }
  .col { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .col b { width: 100%; font-weight: 500; letter-spacing: .08em; color: #a3a6bb; font-size: 12px; }
  button { background: #0d0f16; color: #cfd2e2; border: 1px solid #23263a; border-radius: 5px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: #ff4fd8; color: #ff4fd8; }
  #info { position: fixed; left: 12px; top: 10px; font-size: 12px; color: #a3a6bb; letter-spacing: .06em; }
</style></head>
<body><div id="info">CREW SUIT  ·  loading</div><div id="bar"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/jsm/loaders/GLTFLoader.js';
import { EffectComposer } from '../../vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from '../../vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../../vendor/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../../vendor/jsm/postprocessing/OutputPass.js';
import { Crew } from '../client/crew.js?v=10';

// the same violet edge main.js gives every mesh, so the suit is judged as it will be seen
THREE.ShaderChunk.emissivemap_fragment += `
#ifdef USE_RIM
  { float rimF = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 6.0), rimD = smoothstep(60.0, 6.0, length(vViewPosition));
    totalEmissiveRadiance += vec3(0.48, 0.30, 1.0) * rimF * rimD * 0.7; }
#endif`;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
scene.fog = new THREE.FogExp2(0x04060c, 0.016); scene.background = new THREE.Color(0x02030a);
scene.add(new THREE.HemisphereLight(0x5a6fb0, 0x020306, 0.09));
const fire = new THREE.PointLight(0xff8fe6, 22, 16, 1.6); fire.position.set(0, 1.0, 2.6); scene.add(fire);   /* (the camp's fire in front of them) */
const work = new THREE.PointLight(0xdfe6ff, 6, 10, 1.6); work.position.set(-3, 2.4, -1); scene.add(work);   /* (a cold work lamp behind) */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x15161c, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 0.82)); composer.addPass(new OutputPass());
let camA = 0.35, camD = 6.2, camY = 1.25; const look = new THREE.Vector3(0, 1.0, 0);
const placeCam = () => { camera.position.set(Math.sin(camA) * camD, camY, Math.cos(camA) * camD); camera.lookAt(look); }; placeCam();
let drag = null; addEventListener('pointerdown', e => { if (e.target === renderer.domElement) drag = e.clientX; }); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (drag === null) return; camA -= (e.clientX - drag) * 0.008; drag = e.clientX; placeCam(); });
addEventListener('wheel', e => { camD = Math.max(1.6, Math.min(30, camD * (e.deltaY > 0 ? 1.1 : 0.9))); placeCam(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// each state is what main.js would hand the crew for one player: speed and direction (treadmill: they stay on their mark), aim, fire, hurt, fallen
const STATES = { idle: {}, walk: { f: 1.3 }, run: { f: 4.2 }, back: { f: -3 }, left: { s: -3.2 }, right: { s: 3.2 }, shoot: { shooting: true }, 'run+shoot': { f: 4, shooting: true },
  hurt: { hurtEvery: 1.4 }, fallen: { fallen: true }, 'aim up': { pitch: 0.8 }, 'aim down': { pitch: -0.7 }, drive: { seat: 'drive', f: 6 } };
const start = ['idle', 'run', 'shoot', 'fallen'], P = start.map((s, i) => ({ id: i + 1, x: (i - 1.5) * 1.6, y: 0, z: 0, yaw: Math.PI - 0.25, pitch: 0, state: s, hurt: 0, ht: 0 }));
const bar = document.getElementById('bar');
P.forEach((p, i) => { const col = document.createElement('div'); col.className = 'col'; col.innerHTML = `<b>CREW ${i + 1}</b>`;
  for (const k of Object.keys(STATES)) { const b = document.createElement('button'); b.textContent = k; b.dataset.k = k; b.onclick = () => { p.state = k; p.ht = 0; draw(); }; col.append(b); }
  bar.append(col); p.col = col; });
const draw = () => P.forEach(p => p.col.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === p.state)));
window.setState = (i, k) => { P[i].state = k; P[i].ht = 0; draw(); }; window.P = P; window.cam = (a, d, y, lx = 0, ly = 1) => { camA = a; camD = d; if (y !== undefined) camY = y; look.set(lx, ly, 0); camera.position.set(lx + Math.sin(camA) * camD, camY, Math.cos(camA) * camD); camera.lookAt(look); };
draw();

const L = new GLTFLoader(); const [soldier, ar] = await Promise.all([L.loadAsync('../../assets/c/soldier.glb'), L.loadAsync('../../assets/m/ar.glb')]);
const crew = new Crew(scene, soldier, { gun: ar }); window.crew = crew; const st = crew.stats();
const out = P.map(p => ({ id: p.id, x: 0, y: 0, z: 0, yaw: 0, pitch: 0 }));
const clock = new THREE.Clock(); let fpsT = 0, fpsN = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (let i = 0; i < P.length; i++) { const p = P[i], S = STATES[p.state], o = out[i], sy = Math.sin(p.yaw), cy = Math.cos(p.yaw), f = S.f || 0, s = S.s || 0;
    o.x = p.x; o.y = p.y; o.z = p.z; o.yaw = p.yaw; o.pitch = S.pitch || 0; o.vx = -sy * f + cy * s; o.vz = -cy * f - sy * s; o.shooting = !!S.shooting; o.fallen = !!S.fallen; o.seat = S.seat;
    if (S.hurtEvery) { p.ht -= dt; if (p.ht <= 0) { p.ht = S.hurtEvery; p.hurt++; } } o.hurt = p.hurt; }
  crew.update(dt, out); composer.render();
  fpsN++; fpsT += dt; if (fpsT > 1) { document.getElementById('info').textContent = `CREW SUIT  ·  ${st.tris} triangles, ${st.draws} draw calls each  ·  ${Math.round(fpsN / fpsT)} fps  ·  drag to turn, wheel to zoom`; fpsT = fpsN = 0; }
  requestAnimationFrame(tick);
}
tick();
</script></body></html>
