<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap">
<style>
  :root { --ink: #eef0f8; --meta: #a3a6bb; --neon: #ff4fd8; --violet: #7b5cff; --pink: #ff6fb1; --red: #ff3b5c; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 400 17px "Barlow Condensed", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .keys { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; z-index: 5; }
  .keys button { font: 400 20px "Barlow Condensed", sans-serif; letter-spacing: .14em; color: #fff; background: #0c0d14; border: 1.5px solid #000; padding: 10px 22px 6px; cursor: pointer; position: relative; text-shadow: 0 0 0 #000, 1px 1px 0 #000; transition: transform .12s; }
  .keys button::before { content: ''; position: absolute; inset: 0; padding: 1px; background: linear-gradient(120deg, #7b5cff, #ff4fd8, #ff6fb1, #7b5cff); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .keys button small { display: block; font-size: 13px; color: #c9cbe0; letter-spacing: .04em; margin-top: 2px; }
  .keys button:hover { transform: translateY(-2px); } .keys button:active { transform: translateY(1px) scale(.98); }
  .keys button.on { background: #3a1460; }
  .note { position: fixed; left: 18px; top: 16px; z-index: 5; color: var(--meta); font-size: 15px; max-width: 420px; line-height: 1.3; }
  .note b { color: var(--ink); font-weight: 500; font-size: 22px; letter-spacing: .1em; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="note"><b id="title">A. HELMET</b><span id="why"></span></div>
<div class="keys">
  <button data-v="A" class="on">HELMET<small>(Iron Man style)</small></button>
  <button data-v="B">CANOPY<small>(fighter jet glass)</small></button>
  <button data-v="C">GHOST<small>(almost nothing)</small></button>
</div>
<script>
// Three rough looks for the ship's cockpit HUD, over a flying view (mockup only: the numbers move but nothing is wired to the game).
// Grounded in research: the eyes rotate about 15 degrees each way in comfort, so the main readings sit inside a 30 by 30 degree center;
// glance-only things go to the edges (up to 30 degrees). Real fighter HUDs use a flight path marker (where you are really going) and tapes.
const WHY = {
  A: 'The visor curves around your face. Readings sit on its curve and lag a hair behind when the ship turns, so it feels worn, not painted on. Speed is the biggest thing (you are flying). Targets get brackets in the world.',
  B: 'Projected on the canopy glass like a real fighter: a pitch ladder, the speed tape on the left, the height tape on the right, and a flight path marker showing where the ship really goes, not where its nose points.',
  C: 'Almost nothing until you need it: a reticle, the speed under it, and labels on real things. Look toward an edge and that edge wakes up. The most like real AR glasses.',
};
const cv = document.getElementById('c'), x = cv.getContext('2d'); let W, H, D = devicePixelRatio || 1, V = 'A';
function size() { W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); } size(); addEventListener('resize', size);
document.querySelectorAll('.keys button').forEach(b => b.onclick = () => { V = b.dataset.v; document.querySelectorAll('.keys button').forEach(q => q.classList.toggle('on', q === b)); show(); });
function show() { document.getElementById('title').textContent = { A: 'A. HELMET', B: 'B. CANOPY', C: 'C. GHOST' }[V]; document.getElementById('why').textContent = WHY[V]; } show();
const stars = Array.from({ length: 420 }, () => [Math.random() * 2 - 1, Math.random() * 1.2 - 0.2, Math.random()]);
const F = (s, w = 400) => `${w} ${s}px "Barlow Condensed", sans-serif`;
let t0 = performance.now(), lag = { r: 0, p: 0 };
function frame(now) {
  const t = (now - t0) / 1000, roll = Math.sin(t * 0.35) * 0.32, pitch = Math.sin(t * 0.22) * 0.08, speed = 412 + Math.sin(t * 0.5) * 60, alt = 1840 + Math.sin(t * 0.18) * 300, heading = (t * 6) % 360;
  lag.r += (roll - lag.r) * 0.06; lag.p += (pitch - lag.p) * 0.06;   // (the helmet's readings settle a beat after the ship moves)
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  // the world: stars, the dark Earth's rim far ahead, and the ground below the horizon (it banks with the ship)
  x.save(); x.translate(W / 2, H / 2 + pitch * H); x.rotate(-roll);
  for (const s of stars) { const a = 0.35 + s[2] * 0.65; x.fillStyle = s[2] > 0.92 ? `rgba(255,111,177,${a})` : s[2] > 0.84 ? `rgba(123,92,255,${a})` : `rgba(238,240,248,${a * 0.8})`; x.fillRect(s[0] * W * 0.9, -s[1] * H, s[2] > 0.9 ? 2 : 1.2, s[2] > 0.9 ? 2 : 1.2); }
  const g = x.createRadialGradient(W * 0.3, -H * 0.22, 5, W * 0.3, -H * 0.22, H * 0.16); g.addColorStop(0, '#000'); g.addColorStop(0.82, '#05020c'); g.addColorStop(0.9, '#5a1a8a'); g.addColorStop(0.94, '#ff4fd822'); g.addColorStop(1, '#0000'); x.fillStyle = g; x.beginPath(); x.arc(W * 0.3, -H * 0.22, H * 0.16, 0, 7); x.fill();
  x.fillStyle = '#04030a'; x.fillRect(-W * 1.5, 0, W * 3, H * 2);
  x.strokeStyle = '#7b5cff40'; x.lineWidth = 1; for (let i = 1; i < 14; i++) { const y = Math.pow(i / 14, 2.2) * H; x.beginPath(); x.moveTo(-W * 1.5, y); x.lineTo(W * 1.5, y); x.stroke(); }
  for (let i = -12; i <= 12; i++) { const k = ((i + (t * 0.8) % 1) / 12); x.beginPath(); x.moveTo(k * W * 0.08, 0); x.lineTo(k * W * 2.4, H * 1.6); x.stroke(); }
  // a target in the world: a tower on the horizon
  x.fillStyle = '#0a0812'; x.fillRect(-W * 0.06, -H * 0.12, 26, H * 0.12); x.restore();
  const tgt = (() => { const px = -W * 0.06 + 13, py = -H * 0.06, c = Math.cos(-roll), s = Math.sin(-roll); return [W / 2 + px * c - py * s, H / 2 + pitch * H + px * s + py * c]; })();
  const cx = W / 2, cy = H / 2, U = Math.min(W, H) / 60;   // (one degree, roughly: the screen's short side is about 60 degrees)
  x.lineWidth = 1.5; x.textBaseline = 'middle';
  const line = (c, a, b, cc, d) => { x.strokeStyle = c; x.beginPath(); x.moveTo(a, b); x.lineTo(cc, d); x.stroke(); };
  const text = (s, px, py, size, col, al = 'center', w = 400) => { x.font = F(size, w); x.textAlign = al; x.fillStyle = '#000'; x.fillText(s, px + 1, py + 1); x.fillStyle = col; x.fillText(s, px, py); };
  if (V === 'A') {
    // the visor: its own black edge, curved, with a thin line of light on its inside rim (gloss is a thin edge, never a sheen)
    x.save(); x.translate(cx, cy); x.rotate(-(roll - lag.r) * 0.6); x.translate(0, (pitch - lag.p) * H * 0.5);
    x.fillStyle = '#000'; x.beginPath(); x.rect(-W, -H, W * 2, H * 2); x.ellipse(0, 0, W * 0.56, H * 0.6, 0, 0, Math.PI * 2, true); x.fill('evenodd');
    x.strokeStyle = '#7b5cff'; x.lineWidth = 1.2; x.beginPath(); x.ellipse(0, 0, W * 0.56, H * 0.6, 0, Math.PI * 0.62, Math.PI * 1.38); x.stroke();
    x.strokeStyle = '#ff6fb1'; x.beginPath(); x.ellipse(0, 0, W * 0.56, H * 0.6, 0, -Math.PI * 0.38, Math.PI * 0.38); x.stroke();
    // arcs that carry the readings, on the curve just inside the 30 degree center
    x.lineWidth = 1.5; x.strokeStyle = '#ff4fd8'; x.beginPath(); x.arc(0, 0, 15 * U, Math.PI * 0.82, Math.PI * 1.18); x.stroke();
    x.strokeStyle = '#7b5cff'; x.beginPath(); x.arc(0, 0, 15 * U, -Math.PI * 0.18, Math.PI * 0.18); x.stroke();
    const sk = (speed - 300) / 250; x.strokeStyle = '#ff4fd8'; x.lineWidth = 4; x.beginPath(); x.arc(0, 0, 15 * U + 6, Math.PI * 1.18 - sk * Math.PI * 0.36, Math.PI * 1.18); x.stroke();
    text(Math.round(speed), -15 * U - 14, -U * 0.5, 54, '#ff4fd8', 'right'); text('METERS A SECOND', -15 * U - 14, U * 2.6, 15, '#eef0f8', 'right');
    text(Math.round(alt), 15 * U + 14, -U * 0.5, 34, '#7b5cff', 'left'); text('HIGH', 15 * U + 14, U * 2, 15, '#eef0f8', 'left');
    // heading along the top of the curve
    for (let d = -30; d <= 30; d += 5) { const hh = Math.round(heading + d), a = -Math.PI / 2 + d * Math.PI / 180 * 0.9, r = 24 * U; const big = hh % 15 === 0; line('#a3a6bb', Math.cos(a) * r, Math.sin(a) * r, Math.cos(a) * (r - (big ? 10 : 5)), Math.sin(a) * (r - (big ? 10 : 5))); if (big) text(String(((hh % 360) + 360) % 360).padStart(3, '0'), Math.cos(a) * (r + 12), Math.sin(a) * (r + 12), 14, '#eef0f8'); }
    text('FLIGHT', 0, 20 * U, 17, '#ff6fb1', 'center', 500); text('fuel 74 of 100   hull whole   light on board 38', 0, 21.6 * U, 14, '#a3a6bb');
    x.restore();
    // the reticle and flight path marker (where you are really going), and the target's bracket in the world
    x.strokeStyle = '#eef0f8'; x.lineWidth = 1.5; x.beginPath(); x.arc(cx + Math.sin(t * 0.4) * 9, cy + 6, 6, 0, 7); x.stroke(); line('#eef0f8', cx - 18 + Math.sin(t * .4) * 9, cy + 6, cx - 7 + Math.sin(t * .4) * 9, cy + 6); line('#eef0f8', cx + 7 + Math.sin(t * .4) * 9, cy + 6, cx + 18 + Math.sin(t * .4) * 9, cy + 6);
    const [tx, ty] = tgt, b = 22; x.strokeStyle = '#ff3b5c'; x.lineWidth = 1.5; for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { x.beginPath(); x.moveTo(tx + sx * b, ty + sy * (b - 8)); x.lineTo(tx + sx * b, ty + sy * b); x.lineTo(tx + sx * (b - 8), ty + sy * b); x.stroke(); }
    text('TOWER 3   2.4 KM   lit windows: none', tx, ty - b - 26, 15, '#ff3b5c'); text('something moved on its roof', tx, ty - b - 10, 13, '#a3a6bb');
  } else if (V === 'B') {
    x.save(); x.translate(cx, cy); x.rotate(-roll); x.translate(0, pitch * H);
    for (let p = -20; p <= 20; p += 5) { if (!p) continue; const y = -p * U * 1.4, wd = 9 * U; x.strokeStyle = p > 0 ? '#ff4fd8' : '#7b5cff'; x.setLineDash(p < 0 ? [6, 5] : []); x.beginPath(); x.moveTo(-wd, y + (p < 0 ? -6 : 6)); x.lineTo(-wd, y); x.lineTo(-3 * U, y); x.moveTo(3 * U, y); x.lineTo(wd, y); x.lineTo(wd, y + (p < 0 ? -6 : 6)); x.stroke(); x.setLineDash([]); text(Math.abs(p), -wd - 14, y, 14, '#eef0f8'); text(Math.abs(p), wd + 14, y, 14, '#eef0f8'); }
    x.strokeStyle = '#ff6fb1'; x.beginPath(); x.moveTo(-16 * U, 0); x.lineTo(-4 * U, 0); x.moveTo(4 * U, 0); x.lineTo(16 * U, 0); x.stroke(); x.restore();
    // tapes, fixed to the glass
    const tape = (px, val, step, col, al, label) => { x.strokeStyle = col; x.strokeRect(px - 30, cy - 11 * U, 60, 22 * U); for (let i = -6; i <= 6; i++) { const v = Math.round(val / step) * step + i * step, y = cy - (v - val) / step * 1.7 * U; if (y < cy - 11 * U || y > cy + 11 * U) continue; line(col, al === 'left' ? px + 30 : px - 30, y, al === 'left' ? px + 22 : px - 22, y); text(v, px, y, 14, '#a3a6bb'); } x.fillStyle = '#000'; x.fillRect(px - 34, cy - 14, 68, 28); x.strokeRect(px - 34, cy - 14, 68, 28); text(Math.round(val), px, cy, 24, col); text(label, px, cy + 11 * U + 14, 14, '#eef0f8'); };
    tape(cx - 20 * U, speed, 20, '#ff4fd8', 'left', 'SPEED'); tape(cx + 20 * U, alt, 100, '#7b5cff', 'right', 'HEIGHT');
    for (let d = -20; d <= 20; d += 5) { const hh = Math.round(heading / 5) * 5 + d, px = cx + (hh - heading) * U * 0.8; line('#a3a6bb', px, cy - 18 * U, px, cy - 18 * U + (hh % 15 ? 5 : 10)); if (hh % 15 === 0) text(String(((hh % 360) + 360) % 360).padStart(3, '0'), px, cy - 18 * U - 10, 14, '#eef0f8'); }
    const fx = cx + Math.sin(t * 0.4) * 14, fy = cy + 10 + pitch * 40; x.strokeStyle = '#eef0f8'; x.beginPath(); x.arc(fx, fy, 7, 0, 7); x.stroke(); line('#eef0f8', fx - 20, fy, fx - 7, fy); line('#eef0f8', fx + 7, fy, fx + 20, fy); line('#eef0f8', fx, fy - 7, fx, fy - 14);
    text('W', cx, cy, 20, '#eef0f8');
    const [tx, ty] = tgt; x.strokeStyle = '#ff3b5c'; x.strokeRect(tx - 18, ty - 18, 36, 36); text('2.4 KM', tx, ty + 30, 15, '#ff3b5c');
    text('FUEL 74   HULL WHOLE   LIGHT 38', cx, cy + 17 * U, 16, '#ff6fb1');
  } else {
    const [tx, ty] = tgt; x.strokeStyle = '#eef0f8'; x.lineWidth = 1.2; x.beginPath(); x.arc(cx, cy, 3, 0, 7); x.stroke();
    text(Math.round(speed), cx, cy + 4 * U, 26, '#ff4fd8'); text('m/s', cx, cy + 5.8 * U, 13, '#a3a6bb');
    line('#ff3b5c', tx, ty - 26, tx, ty - 10); text('TOWER 3  2.4 KM', tx, ty - 36, 15, '#ff3b5c');
    const wake = (Math.sin(t * 0.6) + 1) / 2; x.globalAlpha = wake; text('HIGH ' + Math.round(alt), W - 40, cy, 22, '#7b5cff', 'right'); text('FUEL 74   HULL WHOLE', W - 40, cy + 26, 15, '#eef0f8', 'right'); text('(look right to wake it)', W - 40, cy + 46, 13, '#a3a6bb', 'right'); x.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
