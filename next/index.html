<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'sha256-63HB+x6cOSoyjjoUNwGyHweuS+XXQ8XSHH9W7emvUp8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data: https://0.peerjs.com wss://0.peerjs.com http://127.0.0.1:8050; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Last Fire</title>
<meta name="theme-color" content="#04060c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap">
<style>
  :root { --ink: #eef0f8; --meta: #c6c8dc; --neon: #ff4fd8; --violet: #b9a8ff; --pink: #ff6fb1; --red: #ff4f6d; --line: #262a44; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font: 400 17px/1.35 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; user-select: none; }
  canvas { display: block; }
  /* every panel is visor glass (his BOOT pick and UI rule): dark, faint scanlines, corner marks, violet on the left, pink on the right (his rule: cyan the least possible), no rounded box */
  .panel { position: relative; background: repeating-linear-gradient(0deg, rgba(255,79,216,.035) 0 1px, transparent 1px 4px), rgba(3,6,12,.9); border-radius: 0; padding: 24px 26px 20px; }
  .panel::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#7b5cff, #7b5cff) left top / 22px 1.5px no-repeat, linear-gradient(#7b5cff, #7b5cff) left top / 1.5px 22px no-repeat, linear-gradient(#ff6fb1, #ff6fb1) right top / 22px 1.5px no-repeat, linear-gradient(#ff6fb1, #ff6fb1) right top / 1.5px 22px no-repeat, linear-gradient(#7b5cff, #7b5cff) left bottom / 22px 1.5px no-repeat, linear-gradient(#7b5cff, #7b5cff) left bottom / 1.5px 22px no-repeat, linear-gradient(#ff6fb1, #ff6fb1) right bottom / 22px 1.5px no-repeat, linear-gradient(#ff6fb1, #ff6fb1) right bottom / 1.5px 22px no-repeat; }
  .key { display: block; width: 100%; margin: 0 0 10px; padding: 11px 14px 9px; font: 500 19px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .12em; color: #fff; background: #0e0f17; border: 1px solid #000; border-radius: 9px; cursor: pointer; text-align: left; box-shadow: 0 0 0 1px #2c2f4a inset; transition: transform .1s; }
  .key small { display: block; font: 400 14px/1.25 "Barlow Condensed", sans-serif; letter-spacing: .02em; color: var(--meta); margin-top: 3px; }
  .key:hover, .key:focus-visible, .bk:focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--neon) inset; outline: none; } .key:active { transform: translateY(1px); }
  .over { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 10; }
  #list, #dev { background: #000000d8; z-index: 30; } #list .panel, #dev .panel { background: repeating-linear-gradient(0deg, rgba(255,79,216,.035) 0 1px, transparent 1px 4px), rgb(3,6,12); }   /* (a reading page is solid: nothing of the game shows through or overlaps it) */
  #menu { background: radial-gradient(circle at 50% 35%, #0b1022 0%, #000 70%); }
  #menu .panel { width: min(460px, 100%); }
  h1 { margin: 0 0 2px; font: 500 56px/1 "Barlow Condensed", sans-serif; letter-spacing: .14em; } .tag { color: var(--meta); margin: 0 0 18px; font-size: 18px; }
  #name { width: 100%; margin-bottom: 10px; font: 500 22px "Barlow Condensed", sans-serif; letter-spacing: .12em; color: #fff; background: #0b0c14; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; outline: none; }
  .note { font-size: 15px; color: var(--meta); margin: 10px 0 0; } .note b { color: var(--neon); font-weight: 500; }
  #paused { background: radial-gradient(circle at 50% 50%, #00000060, #000000c0); } #paused .panel { width: min(420px, 100%); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; } .opts .key { margin: 0; font-size: 16px; padding: 8px 12px 6px; } .opts .key b { color: var(--neon); font-weight: 500; }
  label { display: block; margin: 0 0 14px; } label b { float: right; color: var(--neon); font-weight: 500; } label input { display: block; width: 100%; margin-top: 6px; accent-color: #ff4fd8; }
  /* the HUD */
  /* one reticle, the Halo battle rifle / DMR shape (his pick, 2026-10-19): a thin ring, four short ticks pointing in, a center dot. White on a dark edge so it reads on any ground; it sizes with the screen (21 px across at 900 tall, was 26 px of ticks) and fades out as the sights come up */
  #cross { position: fixed; left: 50%; top: 50%; width: clamp(18px, 2.35vh, 26px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; } #cross svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #hit { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; pointer-events: none; }
  #hit::before, #hit::after { content: ''; position: absolute; left: 10px; top: -2px; width: 2px; height: 26px; background: #fff; transform: rotate(45deg); } #hit::after { transform: rotate(-45deg); }
  #hit.on { opacity: .9; } #hit.shell::before, #hit.shell::after { background: var(--neon); height: 18px; top: 2px; } #hit.shell { opacity: .9; } #hit.kill { opacity: 1; } #hit.kill::before, #hit.kill::after { background: var(--red); }
  #light { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000; }
  #light b { display: block; font: 500 44px/1 "Barlow Condensed", sans-serif; color: var(--neon); } #light span { font-size: 15px; color: var(--meta); letter-spacing: .14em; }
  #fireHud { position: fixed; left: 18px; top: 14px; text-shadow: 0 1px 3px #000; } #fireHud b { font: 500 26px "Barlow Condensed", sans-serif; color: var(--violet); } #fireHud small { display: block; color: var(--meta); font-size: 15px; }
  #phase { position: fixed; right: 18px; top: 14px; text-align: right; text-shadow: 0 1px 3px #000; } #phase b { font: 500 24px "Barlow Condensed", sans-serif; } #phase small { display: block; color: var(--meta); font-size: 15px; }
  #hp { position: fixed; left: 18px; bottom: 22px; width: 200px; } #hp span { font-size: 13px; letter-spacing: .16em; color: var(--meta); } #hp div { height: 5px; background: #ffffff1c; border-radius: 3px; margin-top: 3px; } #hp i { display: block; height: 100%; background: var(--red); border-radius: 3px; }
  #ammo { position: fixed; right: 18px; bottom: 18px; text-align: right; text-shadow: 0 1px 3px #000; } #ammo b { font: 500 48px/1 "Barlow Condensed", sans-serif; } #ammo span { font-size: 22px; color: var(--meta); margin-left: 6px; } #ammo small { display: block; color: var(--neon); font-size: 16px; letter-spacing: .12em; }
  #build { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 8px; }
  #build .bk small { white-space: nowrap; }   /* (a key's line never wraps: his window is 1000 wide) */
  #build:not(:has(.bk:not(.off))) { display: none; }   /* (HUD under 6% of the screen, his rule: the build keys appear only when you carry enough light to use one) */
  .bk { min-width: 110px; padding: 7px 12px 6px; font: 500 16px "Barlow Condensed", sans-serif; letter-spacing: .1em; color: #fff; background: #05060bcc; border: 1px solid #23253a; border-radius: 8px; cursor: pointer; text-align: left; }
  .bk small { display: block; font: 400 13px "Barlow Condensed", sans-serif; color: var(--meta); letter-spacing: .02em; } .bk.on { border-color: var(--neon); } .bk.off { opacity: .45; }
  #msg { position: fixed; left: 50%; top: 27%; transform: translateX(-50%); font-size: 21px; text-shadow: 0 1px 3px #000; text-align: center; max-width: 80vw; pointer-events: none; }
  #prompt { position: fixed; left: 0; top: 0; transform: translate(50vw, 60vh) translate(-50%, -100%); font-size: 17px; letter-spacing: .06em; color: #cfeeff; white-space: nowrap; pointer-events: none; padding: 7px 14px 6px;
    background: repeating-linear-gradient(0deg, rgba(255,79,216,.07) 0 1px, transparent 1px 4px), rgba(4,14,24,.55); }
  #prompt:empty { display: none; }
  /* a holo tag: corner marks only, hung over the thing it belongs to (his UI rule: words are there for a reason in the world) */
  #prompt::before, #prompt::after { content: ''; position: absolute; width: 10px; height: 10px; border: 1.5px solid #ff4fd8; pointer-events: none; }
  #prompt::before { left: 0; top: 0; border-right: 0; border-bottom: 0; } #prompt::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .mark { position: fixed; left: 0; top: 0; padding: 2px 8px; font-size: 15px; letter-spacing: .08em; color: var(--neon); background: #05060bb0; border-radius: 5px; white-space: nowrap; pointer-events: none; } .mark.down { color: var(--red); }
  #room .code { font-size: 18px; letter-spacing: .14em; color: var(--meta); margin: 4px 0 10px; } #room .code b { font-size: 32px; color: #fff; letter-spacing: .3em; margin-left: 8px; font-weight: 500; }
  .ck { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid #ffffff12; font-size: 16px; } .ck b { font-weight: 500; letter-spacing: .1em; font-size: 14px; } .ck small { display: block; color: var(--meta); font-size: 14px; }
  .ck .done { color: var(--neon); } .ck .in { color: var(--violet); } .ck .next { color: var(--pink); } .ck .later { color: var(--meta); } .ck .talk { color: var(--red); }
  #dev .key { margin: 0; }
  body.friend #openDev, body.friend #openList, body.friend #fps { display: none; }   /* (a friend in your room never sees your dev tools) */
  #fps { position: fixed; left: 18px; top: 70px; font-size: 13px; color: var(--meta); }
  #hurt { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 50%, #b0002280 100%); opacity: 0; transition: opacity .15s; }
  /* the home screen: BOOT, his pick of three (2026-10-19): the visor powering on over the live sky and Earth */
  body[class*=menu-] #menu { background: transparent; }
  /* A: BOOT, the visor powering on: menu in the left column under visor rims, a boot log typing once */
  body.menu-A #menu { place-items: center start; padding-left: 7vw; } body.menu-A #menu .panel { background: transparent; width: min(420px, 100%); } body.menu-A #menu .panel::after { display: none; }
  body.menu-A #menu h1 { font-size: 64px; letter-spacing: .3em; font-weight: 400; } #bootLog { display: none; } body.menu-A #bootLog { display: block; position: fixed; right: 6vw; top: 18vh; font: 500 13px "Barlow Condensed", sans-serif; letter-spacing: .12em; color: #ff4fd8; line-height: 1.7; font-size: 15px; white-space: pre; text-align: right; }
  body.menu-A #menu .key { background: #07080dee; box-shadow: 0 0 0 1px #24263a inset; }
  /* grim and heavy (his correction, 2026-10-19): dark matte keys with a quiet edge; the saturated color is only on the words that matter and on hover */
  body.menu-A #menu .key:hover { box-shadow: 0 0 0 1px #ff4fd8 inset; } body.menu-A #menu .key small { color: #c6c8dc; }
  body.menu-A #name, body.menu-A #code { border: 1px solid #2a2c40 !important; background: #07080dee !important; } body.menu-A #name::placeholder, body.menu-A #code::placeholder { color: #6e7090; }
  body.menu-A #menu .tag { color: #eef0f8; } body.menu-A #menu h1 { color: #fff; }
  label.tick { color: #d4d6e8 !important; cursor: pointer; } label.tick input { display: inline-block; width: 18px; height: 18px; margin: 0 9px 0 0; vertical-align: -3px; appearance: none; -webkit-appearance: none; border: 1px solid #3a3d5c; background: #05060b; cursor: pointer; }
  label.tick input:checked { background: #ff4fd8; box-shadow: inset 0 0 0 3px #05060b; }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--meta); font-size: 20px; letter-spacing: .1em; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<div id="bootLog"></div>
<div id="menu" class="over"><div class="panel">
  <h1>LAST FIRE</h1>
  <p class="tag">The dark has no edge. Push it back.</p>
  <p class="note" id="ver" style="margin:-10px 0 16px"></p>
  <input id="name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" aria-label="Your name">
  <div id="worlds"></div>
  <label class="tick" style="margin:-2px 0 12px;font-size:15px;color:var(--meta)"><input type="checkbox" id="asHost"> Open a CONTINUE world to friends (host it)</label>
  <button class="key" id="host">HOST<small>(opens your newest world to your crew; your room code and link never change)</small></button>
  <div style="display:flex;gap:10px;margin-bottom:10px"><input id="code" maxlength="6" placeholder="CODE" autocomplete="off" aria-label="Room code" style="width:150px;font:500 22px 'Barlow Condensed';letter-spacing:.3em;text-transform:uppercase;color:#fff;background:#0b0c14;border:1px solid var(--line);border-radius:9px;padding:0 12px;outline:none"><button class="key" id="join" style="margin:0">JOIN<small>(a friend's code)</small></button></div>
  <button class="key" id="solo">PLAY<small>(your own world, a learned friend keeps the camp with you)</small></button>
  <div id="menuNote" style="min-height:22px;color:var(--neon)"></div>
</div></div>
<div id="hud" hidden>
  <div id="cross"><svg viewBox="-12 -12 24 24"><g fill="none" stroke-linecap="round"><g stroke="#000" stroke-opacity=".55" stroke-width="3.2"><circle r="9.5"/><path d="M0 -9.5V-6M0 9.5V6M-9.5 0H-6M9.5 0H6"/></g><g stroke="#fff" stroke-width="1.3"><circle r="9.5"/><path d="M0 -9.5V-6M0 9.5V6M-9.5 0H-6M9.5 0H6"/></g></g><circle r="1.9" fill="#000" fill-opacity=".55"/><circle r="1.1" fill="#fff"/></svg></div><div id="hit"></div>
  <div id="fireHud"></div><div id="phase"></div>
  <div id="hp"><span>YOUR LIGHT</span><div><i id="hpBar"></i></div></div>
  <div id="light"></div><div id="ammo"></div><div id="build"></div>
  <div id="msg"></div><div id="prompt"></div><div id="fps"></div><div id="hurt"></div>
  <div id="loading">Lighting the fire...</div>
</div>
<div id="paused" class="over" hidden><div class="panel">
  <button class="key" id="resume">BACK TO THE DARK<small>(takes the mouse again)</small></button>
  <label>Mouse speed <b id="vSens"></b><input type="range" id="sSens" min="0.2" max="3" step="0.05"></label>
  <label>Volume <b id="vVol"></b><input type="range" id="sVol" min="0" max="1" step="0.05"></label>
  <label>Field of view <b id="vFov"></b><input type="range" id="sFov" min="60" max="100" step="1"></label>
  <label>Aim speed <b id="vAds"></b><input type="range" id="sAds" min="0.3" max="1" step="0.05"></label>
  <div id="opts" class="opts"></div>
  <div id="room"></div>
  <button class="key" id="openDev">DEV<small>(restart the night, skip ahead, test things, then back to playing)</small></button>
  <button class="key" id="openList">CHECKLIST<small>(every idea you gave, and where it stands)</small></button>
  <button class="key" id="leave">LEAVE<small>(saves your world first)</small></button>
</div></div>
<div id="dev" class="over" hidden><div class="panel" style="width:min(520px,100%)">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><b style="font:500 28px 'Barlow Condensed';letter-spacing:.16em">DEV</b><button class="key" id="devBack" style="width:auto;margin:0">BACK</button></div>
  <div id="devBody" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
  <p class="note" id="devNote"></p>
</div></div>
<div id="list" class="over" hidden><div class="panel" style="width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><b style="font:500 28px 'Barlow Condensed';letter-spacing:.16em">CHECKLIST</b><button class="key" id="listBack" style="width:auto;margin:0">BACK</button></div>
  <div id="listBody"></div>
</div></div>
<div id="tabmenu" class="over" hidden><div class="panel" style="width:min(560px,100%)">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><b style="font:500 28px 'Barlow Condensed';letter-spacing:.16em">MENU</b><button class="key" id="tabBack" style="width:auto;margin:0">BACK<small>(Tab)</small></button></div>
  <details style="margin:0 0 14px"><summary style="cursor:pointer;color:var(--meta);letter-spacing:.12em;font-size:14px">YOUR WORDS (lines your learned copy may say)</summary>
    <textarea id="myLines" rows="4" maxlength="600" placeholder="One short line per row, in your own words. Start a line with kill:, dusk:, hurt:, bank: or fell: to say it at that moment. Only what you type here is ever used." style="width:100%;margin-top:6px;font:400 17px 'Barlow Condensed';color:#fff;background:#0b0c14;border:1px solid var(--line);padding:8px 10px;outline:none;resize:vertical"></textarea></details>
  <div id="fbForm">
    <button class="key" id="fbMic">TALK<small id="fbMicNote">(click, say what's wrong or what you want, click again to stop)</small></button>
    <textarea id="fbText" rows="5" placeholder="Or type it here. Anything: a bug, a feeling, an idea." style="width:100%;font:400 18px 'Barlow Condensed';color:#fff;background:#0b0c14;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;resize:vertical"></textarea>
    <button class="key" id="fbSend" style="margin-top:10px">SEND TO CLAUDE<small>(with a picture of this moment; you're straight back in the game)</small></button>
    <p class="note" id="fbNote"></p>
  </div>
</div></div>
<div id="upd" hidden style="position:fixed;right:18px;bottom:110px;z-index:12;width:min(340px,calc(100vw - 36px))"><div class="panel" style="padding:14px 16px 12px">
  <b style="font:500 20px 'Barlow Condensed';letter-spacing:.12em;color:var(--neon)">UPDATE READY</b><p id="updNote" class="note" style="margin:4px 0 10px"></p>
  <div style="display:flex;gap:8px"><button class="key" id="updYes" style="margin:0">UPDATE NOW<small>(you're right back here)</small></button><button class="key" id="updNo" style="margin:0;width:auto">LATER</button></div>
</div></div>
<script type="module" src="./client/main.js?v=165"></script>
</body>
</html>
